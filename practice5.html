<!DOCTYPE html>

<html>

<head>

<title> Registration Form </title>

</head>

<body style="background-color:pink">


<h2 style="background-color:orange;color:black;text-align:center">Registration form </h2>

<form>

<label for="user name"> user name:</label>

<input type="text" id="user name" placeholder="mounitha">

<br> </br>

<label for="password"> password:</label>
<input type="password" id="password">
<br> </br>

<label for="date"> date of birth:</label>

<input type="date" id="date">

<br> </br>

<label for="Gender">Gender:</label>

<input type="radio" name="gender"
value="Female"> Female

<input type="radio" name="gender"
value="Male"> Male

<input type="radio" name="gender"
value="Others"> Others 
<br> </br>

<label for="Hobby">Hobby: </label>
<input type="checkbox" name="hobby"
value="listening music"> listening music

<input type="checkbox" name="hobby"
value="cooking"> cooking
<br> </br>

<label for="Time">select time:</label>
<input type="time" id="Time">
<br> </br>

<label for="email">Email:</label>

<input type="email" id="email">

<br> </br>

<label for="phone"> phone number:</label>
<input type="tel" id="phone" placeholder="9765412210">

<br> </br>
<div  style="background-color:blue;text-align:center">
<button style="color:white;background-color:blue"> register</button>
</div>
</body>
</form>
</html>
